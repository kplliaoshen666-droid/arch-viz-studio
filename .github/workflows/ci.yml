name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: License-allowlist gate (SEC-01)
        run: npm run lint:licenses
      - name: Supply-chain audit (SEC-02)
        run: npm audit --omit=dev --audit-level=high
      - name: Build viewer
        run: npm run build:app
